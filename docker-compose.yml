version: '3.8'

services:
  web:
    build: .
    container_name: sangre-signal-web
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data  # Persistent cache storage
      - /home/davdunc/src/sangre-signal:/home/davdunc/src/sangre-signal  # Mount sangre-signal source
    environment:
      - FLASK_ENV=production
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add nginx for production deployment
  nginx:
    image: nginx:alpine
    container_name: sangre-signal-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL certificates (if using HTTPS)
    depends_on:
      - web
    restart: unless-stopped
    profiles:
      - production  # Only include with --profile production

volumes:
  cache_data:
    driver: local